apiVersion: v1
kind: Secret
metadata:
  name: ecoswap-secrets
  labels:
    app: ecoswap
    tier: backend
type: Opaque
# Note: Values must be base64-encoded in real Kubernetes environments
# Example: echo -n 'your_secret' | base64
stringData:
  MONGO_URI: "mongodb+srv://<username>:<password>@cluster0.mongodb.net/ecoswap?retryWrites=true&w=majority"
  JWT_SECRET: "ecoswap_kubernetes_production_jwt_secret"
  AWS_ACCESS_KEY_ID: "your_aws_access_key_placeholder"
  AWS_SECRET_ACCESS_KEY: "your_aws_secret_key_placeholder"

