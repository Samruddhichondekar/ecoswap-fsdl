apiVersion: v1
kind: Service
metadata:
  name: ecoswap-backend-service
  labels:
    app: ecoswap
    tier: backend
spec:
  type: NodePort # Allows external access on Minikube / local cluster
  selector:
    app: ecoswap
    tier: backend
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050
      nodePort: 30550 # Accessible at http://<node-ip>:30550

